name: Auto Renew HidenCloud Pro

on:
  workflow_dispatch: 
  schedule:
    # 结合你的续期窗口，建议定在 UTC 周六 22:35 和周日 15:36
    - cron: '35 22 * * 6'
  # - cron: '36 15 * * 0'

permissions:
  actions: write
  contents: write

jobs:
  Renew-HidenCloud:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 关键修正：必须使用 patchright 才能实施底层鼠标轨迹模拟
      - name: 🛠️️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install patchright requests 'requests[socks]'
          python -m patchright install --with-deps chrome
          
      - name: ⚙ 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)
          
      - name: 🚀 运行续期脚本
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          COOKIE_VALUE: ${{ secrets.COOKIE_VALUE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_APPSECRET: ${{ secrets.WECHAT_APPSECRET }}
          WECHAT_OPENID: ${{ secrets.WECHAT_OPENID }}
          WECHAT_OPENID2: ${{ secrets.WECHAT_OPENID2 }}
          WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: |
          # 提前获取出口 IP 并通知 GitHub Actions 进行日志脱敏 (将 IP 隐藏为 ***)
          # 优先尝试通过 sing-box 常用的本地代理端口获取，如果全失败则获取直连 IP
          EXPORT_IP=$(curl -s --socks5-hostname 127.0.0.1:2080 https://api.ipify.org || curl -s --socks5-hostname 127.0.0.1:1080 https://api.ipify.org || curl -s https://api.ipify.org)         
          
          # 验证获取到的内容是否为合法的 IPV4 格式，防止获取失败导致将空字符串或错误提示作为掩码
          if [[ $EXPORT_IP =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::add-mask::$EXPORT_IP"
          fi
          
          # 启动虚拟屏幕运行 Python 任务
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 -u app.py

      # 原作者防 GitHub Actions 长时间未提交自动禁用的机制
      - name: 🕒 更新保活时间
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" > time.txt
          git add time.txt
          if git diff --cached --quiet; then
            echo "No need to commit"
          else
            git commit -m "⏱️️ Auto Update by Github Actions $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
            git push origin main
          fi

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
